port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: :9090

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  preferred-subnet: true
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxies:
  - name: "whitelist"
    type: vless
    server: 146.185.197.23
    port: 443
    uuid: 7783ba27-8822-4f61-9f9e-4ae2b17f8784
    udp: true
    tls: true
    client-fingerprint: chrome
    skip-cert-verify: true
    network: tcp
    servername: web.max.ru
    flow: xtls-rprx-vision
    reality-opts:
      public-key: nVnAv6CmCTcpakGSbXTnBZXCo2aUzK8gqg6-Q0keOGk
      short-id: "de4c3c"

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "whitelist"
      - "AUTO-BEST-PING"

  - name: "AUTO-BEST-PING"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "whitelist"

rules:
  - MATCH,PROXY
